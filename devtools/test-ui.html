<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athens Pulse — backend test UI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#1a73e8; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-columns:1fr 420px; grid-template-rows:auto 1fr; height:100vh; }
  header { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px;
           border-bottom:1px solid var(--line); background:var(--card); }
  header b { margin-right:8px; }
  #map { min-height:300px; }
  #panel { overflow-y:auto; padding:10px; border-left:1px solid var(--line); }
  @media (max-width:900px) { body { grid-template-columns:1fr; grid-template-rows:auto 55vh auto; height:auto; } #panel { border-left:0; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .muted { color:var(--muted); font-size:12px; }
  .item { padding:5px 0; border-top:1px solid var(--line); } .item:first-of-type { border-top:0; }
  button, select, input[type=text] { font:inherit; padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { cursor:pointer; } button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; color:#fff; }
  .err { color:#b42318; } .ok { color:#067647; }
  #log { font:11px ui-monospace, monospace; max-height:160px; overflow-y:auto; }
  #chat .me { text-align:right; } #chat .bot { white-space:pre-wrap; }
  [dir=rtl] .row { flex-direction:row-reverse; }
</style>
</head>
<body>
<header>
  <b>Athens Pulse · test UI</b>
  <select id="lang"></select>
  <button id="gps">Use my GPS</button>
  <span class="muted">or click the map · arrow keys walk 5 m</span>
  <label><input type="checkbox" id="lyPlaces"> places</label>
  <label><input type="checkbox" id="lyCrowds" checked> live crowds</label>
  <button id="share">Share my presence: off</button>
  <button id="sim">Simulate 3 users here</button>
</header>
<div id="map"></div>
<div id="panel">
  <section><h2>Tracking</h2><div id="stats" class="muted">Place yourself on the map.</div></section>
  <section><h2>Where you are</h2><div id="place" class="muted">—</div></section>
  <section><h2>Nearest stations (heat)</h2><div id="near" class="muted">—</div></section>
  <section><h2>Around you</h2><div id="around" class="muted">—</div></section>
  <section><h2>Events</h2>
    <div class="row"><span><button data-when="today">today</button> <button data-when="weekend">weekend</button> <button data-when="week">week</button></span><span id="evCount" class="muted"></span></div>
    <div id="events" class="muted">—</div></section>
  <section><h2>Assistant</h2><div id="chat"></div>
    <form id="ask" class="row"><input type="text" id="q" placeholder="e.g. «πού είναι το κοντινότερο ΚΕΠ;» or «is it hot?»" style="flex:1"><button>Send</button></form></section>
  <section><h2>API log</h2><div id="log"></div></section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const km = (m) => (m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${m} m`);
let L = {}; // code → label in the chosen language (from /api/i18n)
const t = (code) => esc(L[code] ?? code);

// ---------- every API call goes through here, so the log shows status and time ----------
async function api(path, body) {
  const t0 = performance.now();
  let status = 0, json = null;
  try {
    const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    status = r.status; json = await r.json();
  } catch (e) { json = { error: e.message }; }
  const ms = Math.round(performance.now() - t0);
  $("log").insertAdjacentHTML("afterbegin", `<div class="${status === 200 ? "ok" : "err"}">${status} ${ms}ms ${body ? "POST " : ""}${esc(path.replace(/lat=[^&]+&lon=[^&]+/, "lat=…&lon=…"))}${status !== 200 ? " — " + esc(json?.error) : ""}</div>`);
  if (status !== 200) throw new Error(json?.error || status);
  return json;
}
const CROWD = { crowd_low: "#f4c430", crowd_medium: "#f08c00", crowd_high: "#d92d20" };
const BUSY = { quiet: "#067647", usual: "#667085", busy: "#d92d20" };
function haversine(a, b) {
  const R = 6371008.8, r = Math.PI / 180, dp = (b.lat - a.lat) * r, dl = (b.lon - a.lon) * r;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

let map, me, pos = null, track = null, lastCall = null, nextRefreshAt = 0, watchId = null, when = "week";
const stats = { fixes: 0, calls: 0 }, layers = { places: [], crowds: [] };

// ---------- language ----------
async function setLang(lang) {
  const r = await api(`/api/i18n?lang=${lang}`);
  L = r.labels; document.documentElement.dir = r.dir; document.documentElement.lang = r.lang;
  if (pos) { render(); loadHere(); }
  loadEvents(); drawPlaces();
}

// ---------- live tracking: /api/track only when the answer can have changed ----------
async function onFix(p, source) {
  pos = p; stats.fixes++;
  if (me) { me.setCenter({ lat: p.lat, lng: p.lon }); me.setMap(map); }
  const moved = lastCall ? haversine(lastCall, p) : Infinity;
  if (!track || moved >= track.recheck_after_m || Date.now() >= nextRefreshAt) {
    try {
      track = await api(`/api/track?lat=${p.lat.toFixed(5)}&lon=${p.lon.toFixed(5)}`);
      stats.calls++; lastCall = p; nextRefreshAt = Date.now() + track.meta.next_refresh_s * 1000;
      if (!lastHere || haversine(lastHere, p) > 300) loadHere();  // the heavier panel only every ~300 m
    } catch (e) {}
  }
  $("stats").innerHTML = `Source <b>${source}</b> · GPS fixes ${stats.fixes} · /api/track calls ${stats.calls}
    (${stats.fixes ? Math.round(100 * (1 - stats.calls / stats.fixes)) : 0}% saved) · recheck after <b>${track ? track.recheck_after_m : "—"} m</b>`;
  render();
}
function render() {
  if (!track) return;
  $("near").innerHTML = track.nearest_stations.map((s) => `<div class="item"><div class="row"><b>${esc(s.name)}</b><span class="muted">${km(s.distance_m)}</span></div>
    <div class="row"><span>${s.temperature} °C · feels ${s.feels_like} °C · ${t(s.heat_level)}</span><span class="muted">humidity ${s.humidity ?? "—"}%</span></div></div>`).join("");
}

// ---------- /api/here: zone, footfall, cooling, places, events nearby ----------
let lastHere = null;
async function loadHere() {
  if (!pos) return;
  lastHere = pos;
  let h;
  try { h = await api(`/api/here?lat=${pos.lat.toFixed(3)}&lon=${pos.lon.toFixed(3)}`); } catch (e) { return; }
  const z = h.zone, loc = h.location, f = h.footfall;
  $("place").innerHTML = loc.match === "outside" ? "Outside the Municipality of Athens" :
    `<div class="row"><b>${esc(loc.neighbourhood)}</b><span class="muted">${esc(z?.name || "")}</span></div>
     ${z?.heat ? `<div class="row"><span>Zone heat</span><span>${z.heat.temperature_avg} °C · ${t(z.heat.heat_level)}</span></div>` : ""}
     <div class="row"><span>Footfall (WiFi, yesterday)</span><span>${f && f.busyness ? `<span class="pill" style="background:${BUSY[f.busyness]}">${t(f.busyness)}</span> ${f.change_vs_usual_pct}% · ${f.based_on} spots` : `no data${f?.nearest_m ? ` (nearest spot ${km(f.nearest_m)})` : ""}`}</span></div>`;
  const list = (items, fmt) => (items && items.length ? items.map(fmt).join("") : `<div class="muted">—</div>`);
  $("around").innerHTML =
    `<b>Places within 1 km</b>` + list(h.places_nearby, (p) => `<div class="item row"><span>${esc(lang() === "el" ? p.name : p.name_en)} <span class="muted">${t(p.kind)}${p.lines?.length ? " " + esc(p.lines.join(" ")) : ""}</span></span><span class="muted">${km(p.distance_m)}</span></div>`) +
    `<b>${t("accessible_parking")}</b>` + list(h.accessible_parking, (p) => `<div class="item row"><span>${esc(p.name)}</span><span class="muted">${km(p.distance_m)}</span></div>`) +
    `<b>Cool down</b>` + list(h.cooling && Object.values(h.cooling), (c) => `<div class="item row"><span>${t(c.kind)}: ${esc(c.name)}</span><span class="muted">${km(c.distance_m)}</span></div>`) +
    `<b>Events nearby this week</b>` + list(h.events_nearby, (e) => `<div class="item row"><span><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a> <span class="muted">${esc(e.date)} · ${esc(e.venue.name)}</span></span><span class="muted">${km(e.distance_m)}</span></div>`);
}
const lang = () => $("lang").value;

// ---------- events by date ----------
async function loadEvents() {
  document.querySelectorAll("[data-when]").forEach((b) => { b.classList.toggle("on", b.dataset.when === when); b.textContent = L[b.dataset.when] || b.dataset.when; });
  try {
    const r = await api(`/api/events?when=${when}&limit=200`);
    const seen = new Set();
    const shows = r.events.filter((e) => !seen.has(e.name + e.venue.name) && seen.add(e.name + e.venue.name));
    $("evCount").textContent = `${r.count} performances · ${shows.length} shows`;
    $("events").innerHTML = shows.slice(0, 12).map((e) => `<div class="item"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a>
      <div class="muted">${esc(e.date)} ${esc((e.time || "").slice(0, 5))} · ${esc(e.venue.name)} · ${t(e.category || "")} · ${t(e.status)}</div></div>`).join("") || "—";
  } catch (e) { $("events").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
document.querySelectorAll("[data-when]").forEach((b) => (b.onclick = () => { when = b.dataset.when; loadEvents(); }));

// ---------- map layers ----------
function clear(name) { layers[name].forEach((o) => o.setMap(null)); layers[name] = []; }
let placesCache = null;
const ICON = { museum: "M", gallery: "G", theatre: "T", library: "L", cultural_centre: "C", cinema: "C", metro_station: "Ⓜ",
  tram_stop: "T", rail_station: "R", free_wifi: "W", accessible_parking: "♿", fountain: "💧", pocket_park: "🌳", pool: "🏊" };
async function drawPlaces() {
  clear("places"); if (!map || !$("lyPlaces").checked) return;
  placesCache = placesCache || (await api("/api/places")).places;
  const info = new google.maps.InfoWindow();
  for (const p of placesCache) {
    if (p.kind === "place") continue; // 302 named places would cover the map
    const m = new google.maps.Marker({ map, position: { lat: p.lat, lng: p.lon }, title: p.name_en,
      label: { text: ICON[p.kind] || "•", fontSize: "11px" } });
    m.addListener("click", () => { info.setContent(`<b>${esc(lang() === "el" ? p.name : p.name_en)}</b><br>${t(p.kind)}${p.address ? "<br>" + esc(p.address) : ""}`); info.open(map, m); });
    layers.places.push(m);
  }
}
async function drawCrowds() {
  clear("crowds"); if (!map || !$("lyCrowds").checked) return;
  let r; try { r = await api("/api/crowds"); } catch (e) { return; }
  for (const c of r.cells) {
    const dLat = 0.001, dLon = 0.00125;  // half a cell
    layers.crowds.push(new google.maps.Rectangle({ map, clickable: false, strokeWeight: 0, fillColor: CROWD[c.level], fillOpacity: 0.45,
      bounds: { north: c.lat + dLat, south: c.lat - dLat, east: c.lon + dLon, west: c.lon - dLon } }));
  }
}
$("lyPlaces").onchange = drawPlaces; $("lyCrowds").onchange = drawCrowds;
setInterval(drawCrowds, 60000);

// ---------- presence (opt-in) and the simulator ----------
const session = sessionStorage.getItem("session") || (sessionStorage.setItem("session", crypto.randomUUID()), sessionStorage.getItem("session"));
let shareTimer = null;
const ping = (s) => pos && api("/api/presence", { session: s, lat: pos.lat, lon: pos.lon }).catch(() => {});
$("share").onclick = () => {
  if (shareTimer) { clearInterval(shareTimer); shareTimer = null; }
  else { ping(session); shareTimer = setInterval(() => ping(session), 120000); }
  $("share").classList.toggle("on", !!shareTimer); $("share").textContent = `Share my presence: ${shareTimer ? "on" : "off"}`;
};
$("sim").onclick = async () => {
  if (!pos) return alert("Place yourself on the map first");
  await Promise.all([0, 1, 2].map(() => ping(crypto.randomUUID())));
  drawCrowds();
};

// ---------- assistant ----------
let conv = null;
$("ask").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("q").value.trim(); if (!text) return;
  $("q").value = ""; $("chat").insertAdjacentHTML("beforeend", `<div class="item me">${esc(text)}</div>`);
  try {
    const r = await api("/api/assistant", { text, conversation_id: conv, ...(pos ? { lat: pos.lat, lon: pos.lon } : {}) });
    conv = r.conversation_id;
    $("chat").insertAdjacentHTML("beforeend", `<div class="item bot">${esc(r.text)}<div class="muted">${esc(r.source)}${r.truncated ? " · truncated" : ""}</div></div>`);
  } catch (err) { $("chat").insertAdjacentHTML("beforeend", `<div class="item err">${esc(err.message)}</div>`); }
};

// ---------- position sources ----------
$("gps").onclick = () => {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition((p) => onFix({ lat: p.coords.latitude, lon: p.coords.longitude }, "GPS"),
    (e) => alert("Location error: " + e.message), { enableHighAccuracy: true });
};
const simulate = (p) => { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } onFix(p, "map"); };
document.addEventListener("keydown", (e) => {
  const d = { ArrowUp: [5, 0], ArrowDown: [-5, 0], ArrowRight: [0, 5], ArrowLeft: [0, -5] }[e.key];
  if (!d || !pos || e.target.tagName === "INPUT") return;
  e.preventDefault();
  simulate({ lat: pos.lat + d[0] / 110540, lon: pos.lon + d[1] / (111320 * Math.cos(pos.lat * Math.PI / 180)) });
});

// ---------- start ----------
(async () => {
  const langs = (await api("/api/i18n")).languages;
  $("lang").innerHTML = langs.map((l) => `<option>${l}</option>`).join("");
  $("lang").onchange = () => setLang(lang());
  const { mapsKey } = await api("/api/config");
  if (!mapsKey) { $("map").innerHTML = `<p class="err" style="padding:16px">GOOGLE_MAPS_API_KEY is not set</p>`; }
  else {
    ((g)=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({ key: mapsKey, v: "weekly" });
    const { Map } = await google.maps.importLibrary("maps");
    await google.maps.importLibrary("marker");
    map = new Map($("map"), { center: { lat: 37.9838, lng: 23.7275 }, zoom: 14, clickableIcons: false, streetViewControl: false });
    me = new google.maps.Circle({ radius: 25, fillColor: "#1a73e8", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3, zIndex: 10, clickable: false });
    map.addListener("click", (e) => simulate({ lat: e.latLng.lat(), lon: e.latLng.lng() }));
    drawCrowds();
  }
  await setLang("en");
})();
</script>
</body>
</html>
